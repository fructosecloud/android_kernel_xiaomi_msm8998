name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: fructosecloud/android_kernel_xiaomi_msm8998
          ref: lineage-23.2      # 替换为实际分支
          path: kernel/source

      - name: Build kernel
        uses: dabao1955/kernel_build_action@v1.10.1
        with:
          kernel-url: ./kernel/source/
          config: local_defconfig
          arch: arm64
          android-version: 16
          aosp-clang: true
          aosp-clang-version: r547379
          aosp-gcc: false               # 同时使用 AOSP GCC 辅助编译
          # Bootlin GCC 11.x (aarch64)
          other-gcc64-url: https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-2022.08-1.tar.bz2
          # Bootlin GCC 11.x (arm)
          other-gcc32-url: https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--glibc--stable-2022.08-1.tar.bz2
          ccache: true                  # 开启缓存
          #disable-lto: true             # 禁用 LTO，避免老内核链接失败
          # extra-make-args: '["LLVM=1", "LLVM_IAS=1"]'  # 暂时注释，需要时再开启
          anykernel3: true

